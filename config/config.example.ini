; ebctool configuration example.
; Copy this file to config/config.ini and edit the copy; config/config.ini is
; ignored by git. Relative paths resolve from the repo root (bin/ebc.sh cds there).

[serial]
port = auto            ; auto = first /dev/cu.wchusbserial*, then /dev/cu.usbserial*
parity = E             ; E or O, set by discovery
baud = 9600
silence_timeout_s = 10

[run]
log_dir = logs
db_path = db/ebctool.db
log_frames = false

[limits]
min_current_a = 0.5
max_current_a = 20.0
min_cutoff_v = 8.0
max_cutoff_v = 88.0
